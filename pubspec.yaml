name: sansgato
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.6
  image_picker: ^1.2.2
  firebase_core: ^4.11.0
  firebase_storage: ^13.4.3
